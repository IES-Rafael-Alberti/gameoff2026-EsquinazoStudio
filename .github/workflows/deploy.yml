name: Publish to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Butler
        uses: remarkablegames/setup-butler@v2

      - name: Publish game
        env:
          ITCHIO_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ./build Esquina Studio/Dungeon Stacker:html5
