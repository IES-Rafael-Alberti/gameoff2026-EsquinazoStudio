name: Publish to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Butler
        uses: remarkablegames/setup-butler@v2

      - name: Rename HTML to index.html
        run: mv ./build/dungeon-stacker.html ./build/index.html

      - name: Publish game
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          butler push ./build "esquina-studio/dungeon-stacker:html5"
