name: Publish to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export game for Web
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Package Web build
        run: |
          cd build/web
          zip -r ../web.zip .

      - name: Install Butler
        uses: remarkablegames/setup-butler@v2

      - name: Publish game
        env:
          ITCHIO_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          butler push ./build/web.zip "Esquina Studio/Dungeon Stacker:html5"
