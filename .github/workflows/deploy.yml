
name: Publish to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export game for Web
        run: |
          mkdir -p build
          godot --headless --path "Dungeon Stacker" \
            --export-release "Web" build/dungeon-stacker.html

      - name: Check exported files
        run: |
          test -f build/dungeon-stacker.html
          ls -lah build/

      - name: Install Butler
        uses: remarkablegames/setup-butler@v2

      - name: Publish game
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          butler push ./build "Esquina Studio/Dungeon Stacker:html5"
